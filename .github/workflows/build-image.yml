name: Build image
run-name: Build image ${{ github.event.client_payload.version || inputs.version }}

on:
  # Fired by app-go after each successful release.
  repository_dispatch:
    types: [new-release]
  # Manual fallback: rebuilds and backfills.
  workflow_dispatch:
    inputs:
      version:
        description: app-go release tag to package (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

env:
  APP_REPO: ElAntagonista/app-go
  IMAGE: ghcr.io/elantagonista/app-go

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" -R "$APP_REPO" -D dist \
            -p "app_${VERSION}_linux_*" -p checksums.txt
          (cd dist && sha256sum -c --ignore-missing checksums.txt)

      - uses: docker/setup-buildx-action@v4

      # Gate B: build each architecture into the local daemon and scan it.
      # Nothing is pushed unless every gate passes.
      - name: Build images for scanning
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg VERSION="$VERSION" -t "app:scan-$arch" .
          done

      - id: cnspec
        uses: ./.github/actions/setup-cnspec

      - uses: ./.github/actions/cnspec-gate
        with:
          title: Dockerfile
          scan: >-
            docker file Dockerfile
            -f ${{ steps.cnspec.outputs.policies }}/mondoo-dockerfile-security.mql.yaml
            -f policies/dockerfile.mql.yaml
            --policy app-gate-dockerfile

      - uses: ./.github/actions/cnspec-gate
        with:
          title: Image filesystem (amd64)
          scan: docker image app:scan-amd64 -f policies/image.mql.yaml

      - uses: ./.github/actions/cnspec-gate
        with:
          title: Image filesystem (arm64)
          scan: docker image app:scan-arm64 -f policies/image.mql.yaml

      - uses: ./.github/actions/cnspec-gate
        with:
          title: Image config
          scan: local -f policies/image-config.mql.yaml

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
