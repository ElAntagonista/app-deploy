name: Build image

on:
  workflow_dispatch:
    inputs:
      version:
        description: app-go release tag to package (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-image-${{ inputs.version }}
  cancel-in-progress: false

env:
  APP_REPO: ElAntagonista/app-go
  IMAGE: ghcr.io/elantagonista/app-go

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" -R "$APP_REPO" -D dist \
            -p "app_${VERSION}_linux_*" -p checksums.txt
          (cd dist && sha256sum -c --ignore-missing checksums.txt)

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
