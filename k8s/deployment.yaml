apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      containers:
        - name: app
          # Tag is pinned in kustomization.yaml.
          image: ghcr.io/elantagonista/app-go
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
